services:
  app:
    build: .
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/modular_rag?connectionTimeZone=UTC
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_dev_password}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHON_INGEST_URL: http://python-ingest:8090/internal/ingest
      PYTHON_INGEST_TOKEN: ${PYTHON_INGEST_TOKEN:-local-dev-token-change-me}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
      python-ingest:
        condition: service_started

  python-ingest:
    build:
      context: ..
      dockerfile: java-service/python/Dockerfile
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PYTHON_INGEST_TOKEN: ${PYTHON_INGEST_TOKEN:-local-dev-token-change-me}
      PYTHON_INGEST_HOST: 0.0.0.0
      INGEST_OFFLINE: "true"
      INGEST_DATA_DIR: /app/data
    volumes:
      - python_data:/app/data
    depends_on:
      minio:
        condition: service_started

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: modular_rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    build:
      context: .
      dockerfile: minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
  kafka_data:
  python_data:
