llm:
  provider: openai
  model: gpt-4o-mini
embedding:
  provider: openai
  model: text-embedding-3-small
vector_store:
  provider: chroma
  persist_directory: data/db/chroma
retrieval:
  strategy: hybrid
  top_k: 5
rerank:
  provider: none
  top_n: 5
evaluation:
  provider: custom
observability:
  level: INFO
  traces_path: logs/traces.jsonl
ingestion:
  chunk_refiner:
    use_llm: false
    prompt_path: config/prompts/chunk_refinement.txt
  metadata_enricher:
    use_llm: false
  image_captioner:
    enabled: false
    prompt_path: config/prompts/image_captioning.txt
  batch_processor:
    batch_size: 32
